name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.G_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u edge-surv --password-stdin

      - name: Build Docker image
        run: |
          docker build . --tag ghcr.io/edge-surv/deep-edge-surv-api:latest

      - name: Push Docker image
        run: |
          docker push ghcr.io/edge-surv/deep-edge-surv-api:latest
