name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        run: | 
          docker login --username edg-surv --password ${{ secrets.G_TOKEN }} ghcr.io
          docker build . --tag ghcr.io/edgesurv:latest
          docker push ghcr.io/edgesurv:latest
          
